<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMU Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <a href="#" class="brand">
      <!-- Replace this SVG with <img src="logo.png" alt=""> -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z" fill="currentColor"/></svg>
      <span>MMU Navigator</span>
    </a>
    <a href="#" class="admin-link">Admin</a>
  </header>

  <div class="app">
    <!-- LEFT PANEL -->
    <aside class="panel">
      <div class="search">
        <div class="search-row">
          <input type="search" placeholder="Search here [CQCR3001]">
        </div>
      </div>

      <!-- Search results go here -->
      <div class="results"></div>
    </aside>

    <!-- MAP -->
    <main class="map">
      <!-- Category chips float over the top of the map -->
      <div class="chips">
        <span class="chip">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v7a2 2 0 0 0 2 2v9M9 3v7a2 2 0 0 1-2 2M7 3v6"/><path d="M17 21V3c-2.5 1.5-4 4.5-4 8v2h4"/></svg>
          Starbees
        </span>
        <span class="chip">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20V6M3 12h18v8M21 12V9a2 2 0 0 0-2-2h-8v5"/><circle cx="7" cy="9" r="1.5"/></svg>
          FCI
        </span>
      </div>

      <!-- Map goes here -->
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([2.9278, 101.6419], 17);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      referrerPolicy: "strict-origin-when-cross-origin",
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
  </script>
</body>
</html>
