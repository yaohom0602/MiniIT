<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | MMU Navigator</title>
    <link rel="stylesheet" href="{{ url_for('admin_stylesheet') }}">
</head>
<body>

    <header class="admin-topbar">
        <a href="/" class="admin-brand">
            <span class="brand-icon">M</span>
            <span>MMU Navigator</span>
        </a>
        <span class="admin-label">Password Recovery</span>
    </header>

    <main class="login-container">
        <div class="login-card">

            <h1>Forgot Password?</h1>
            <p>Enter your registered admin email address to reset your password.</p>

            {% if message %}
                <div class="success-message">{{ message }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('forgot_password') }}">

                <input type="hidden" name="csrf_token"
                       value="{{ csrf_token() }}">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your admin email"
                        required
                    >
                </div>

                <button type="submit" class="login-button">
                    Submit
                </button>

            </form>

            <a href="{{ url_for('admin_login') }}" class="back-link">
                Back to Sign In
            </a>

        </div>
    </main>

</body>
</html>
