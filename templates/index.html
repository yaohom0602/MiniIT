<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MMU Navigator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <a href="#" class="brand">
      <!-- Replace this SVG with <img src="logo.png" alt=""> -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5z" fill="currentColor"/></svg>
      <span>MMU Navigator</span>
    </a>
    
<div class="admin-actions">

    {% if session.get('admin_id') %}

        <span class="admin-email">
            {{ session.get('admin_email') }}
        </span>

        <form action="{{ url_for('admin.logout') }}" method="POST"
              class="admin-logout-form">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <button type="submit" class="admin-link admin-logout-button">
                Logout
            </button>

        </form>

    {% else %}

        <a href="{{ url_for('admin.admin_login') }}" class="admin-link">
            Admin Login
        </a>

    {% endif %}

</div>

  </header>

  <div class="app">
    <!-- LEFT PANEL -->
    <aside class="panel">
      <div class="search">
        <div class="search-row">
          <input type="search" placeholder="Search here [CQCR3001]">
        </div>

      </div>

      <!-- Search results go here -->
      <div class="results">
        <div class="location-manager">
          <a href="{{url_for('location.manage_locations')}}">Manage Location</a>
        </div>
      </div>
    </aside>

    <!-- MAP -->
    <main class="map">
      <!-- Category chips float over the top of the map -->
      <div class="chips">
        <span class="chip">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-utensils preview-icon"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
          Food
        </span>
        <span class="chip">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-landmark preview-icon"><path d="M10 18v-7"/><path d="M11.119 2.205a2 2 0 0 1 1.762 0l7.84 3.846A.5.5 0 0 1 20.5 7h-17a.5.5 0 0 1-.22-.949z"/><path d="M14 18v-7"/><path d="M18 18v-7"/><path d="M3 22h18"/><path d="M6 18v-7"/></svg>
          Faculty
        </span>
        <details class="category-manager">
          <summary class="chip">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wrench preview-icon"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"/></svg>
          </summary>
          <div class="category-board">
            <h1>Manage Categories</h1>
            <div class="category-item">
              Food
            </div>
          </div>

        </details>
      </div>

      <!-- Map goes here -->
      <div id="map"></div>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map", {
     minZoom: 17,
     maxZoom: 19,
     maxBounds: [
        [2.924961972905159, 100.63835728600566], // Southwest boundary
        [2.931058710832172, 101.64544904650079]  // Northeast boundary
     ],
     maxBoundsViscosity: 1.0
    }).setView([2.9278, 101.6419], 17);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      referrerPolicy: "strict-origin-when-cross-origin",
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
  </script>

</body>
</html>
